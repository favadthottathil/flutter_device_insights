name: Android emulator tests

# Run nightly at 01:00 UTC and on demand.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Integration tests on emulator
    # android-emulator-runner requires a macOS or Linux runner with KVM.
    # ubuntu-latest has KVM and is cheaper than macos-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]   # min supported (Thermal needs 29) and a recent level

    defaults:
      run:
        working-directory: flutter_device_insights/example

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        # Required on ubuntu-latest GitHub-hosted runners for hardware acceleration.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      # Gradle's configuration phase fetches dependencies; do it before the
      # emulator boots so the emulator isn't idle while Gradle warms up.
      - name: Build debug APK (pre-warm Gradle)
        run: flutter build apk --debug

      - name: Run integration tests on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          # Use AOSP (no Google Play) for faster boot; plugin needs no Play APIs.
          target: google_apis
          # Keep the emulator headless.
          emulator-options: -no-window -no-boot-anim -noaudio -no-metrics
          disable-animations: true
          # Run from the example directory.
          script: |
            cd flutter_device_insights/example
            flutter test integration_test \
              --timeout 120s \
              -r expanded
